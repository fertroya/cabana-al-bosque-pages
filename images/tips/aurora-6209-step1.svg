<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
  <title>Panel Aurora 6209</title>
  <rect width="360" height="220" rx="14" fill="#f7fafb"/>
  <rect x="12" y="12" width="336" height="196" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- detergent drawer -->
  <rect x="28" y="36" width="72" height="88" rx="6" fill="#eef2f4" stroke="#2f4f57" stroke-width="1.5"/>
  <text x="64" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748b">Jabonera</text>
  <line x1="40" y1="58" x2="88" y2="58" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="78" x2="88" y2="78" stroke="#94a3b8" stroke-width="1"/>
  <line x1="40" y1="98" x2="88" y2="98" stroke="#94a3b8" stroke-width="1"/>

  <!-- dial -->
  <circle cx="210" cy="95" r="48" fill="#fff7eb" stroke="#e8a54b" stroke-width="4"/>
  <circle cx="210" cy="95" r="10" fill="#2f4f57"/>
  <line x1="210" y1="95" x2="200.4" y2="121.3" stroke="#2f4f57" stroke-width="4" stroke-linecap="round"/>
  <text x="172.7" y="50.6" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#1e3640">A</text><text x="220.1" y="37.9" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#1e3640">C</text><text x="257.5" y="61.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#1e3640">E</text><text x="267.1" y="105.1" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#1e3640">G</text><text x="243.3" y="142.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#1e3640">I</text><text x="190.2" y="149.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#c47d1a">L</text><text x="155.5" y="114.8" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#1e3640">N</text><text x="159.8" y="66.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#1e3640">●</text>
  <text x="210" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#64748b">Selector</text>

  <!-- function buttons row -->
  <g font-family="Arial,sans-serif" font-size="7.5" text-anchor="middle">
    <rect x="28" y="148" width="70" height="28" rx="5" fill="#e8eef0" stroke="#2f4f57" stroke-width="1"/>
    <text x="63" y="165" fill="#475569">Plancha Fácil</text>

    <rect x="106" y="148" width="70" height="28" rx="5" fill="#e8eef0" stroke="#2f4f57" stroke-width="1"/>
    <text x="141" y="165" fill="#475569">Extra Enjuague</text>

    <rect x="184" y="148" width="70" height="28" rx="5" fill="#e8eef0" stroke="#2f4f57" stroke-width="1"/>
    <text x="219" y="165" fill="#475569" font-weight="600">Lavado Rápido</text>

    <rect x="262" y="148" width="70" height="28" rx="5" fill="#e8eef0" stroke="#2f4f57" stroke-width="1"/>
    <text x="297" y="165" fill="#475569">Inicio Diferido</text>
  </g>

  <!-- start button -->
  <rect x="110" y="186" width="140" height="18" rx="9" fill="#2f4f57" stroke="none" stroke-width="0"/>
  <text x="180" y="198.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#ffffff">INICIO / PAUSA</text>

  <text x="300" y="42" text-anchor="end" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#2f4f57">Aurora 6209</text>
</svg>